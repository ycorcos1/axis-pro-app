appId: com.axispro.app
productName: Axis Pro
directories:
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - app/renderer/dist/**/*
  - package.json
extraResources:
  - from: resources/ffmpeg/mac
    to: ffmpeg/mac
    filter: ["**/*", "!.DS_Store"]
  - from: resources/ffmpeg/windows
    to: ffmpeg/windows
    filter: ["**/*", "!.DS_Store"]
mac:
  category: public.app-category.video
  target: dmg
  icon: build/icon.icns
dmg:
  title: Axis Pro
win:
  target: nsis
  icon: build/icon.ico
