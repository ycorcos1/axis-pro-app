appId: com.axispro.app
productName: Axis Pro
directories:
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - app/renderer/dist/**/*
  - package.json
extraResources:
  - resources/ffmpeg/mac/**/*
  - resources/ffmpeg/windows/**/*
mac:
  category: public.app-category.video
  target: dmg
  icon: build/icon.icns
dmg:
  title: Axis Pro
win:
  target: nsis
  icon: build/icon.ico
